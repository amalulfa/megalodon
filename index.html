<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Welcome</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="container">

        <h1></h1>

        <p class="subtitle"></p>


        <section class="section">

            <label>
                Get your search terms
            </label>


            <div
                class="sentence-box"
                id="sentence"
            >
                Click the button to generate a sentence.
            </div>


            <button
                id="randomButton"
                type="button"
            >
                🔀 RANDOM
            </button>

        </section>


        <section class="section">

            <label>
                Thumbnail
            </label>


            <div class="photo-box">

                <img
                    src="images/foto.jpg"
                    alt="Thumbnail"
                >

            </div>

        </section>

    </main>


    <!-- URUTAN HARUS SEPERTI INI -->

    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
