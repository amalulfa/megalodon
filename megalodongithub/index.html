<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cryptic Claws</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <h1>CRYPTIC CLAWS</h1>

        <p class="subtitle">
            Random Content Generator
        </p>


        <!-- KALIMAT -->

        <section class="section">

            <label>
                Random Sentence
            </label>

            <div
                class="sentence-box"
                id="sentence"
            >
                Click the button to generate a sentence.
            </div>

            <button
                id="randomButton"
                type="button"
            >
                🔀 RANDOM
            </button>

        </section>


        <!-- FOTO -->

        <section class="section">

            <label>
                Image
            </label>

            <div class="photo-box">

                <img
                    src="images/foto.jpg"
                    alt="Cryptic Claws"
                >

            </div>

        </section>

    </main>


    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
